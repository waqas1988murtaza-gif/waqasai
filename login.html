<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Portal - Waqas AI Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #060b13;
            --card-bg: #0b111e;
            --accent-red: #ef4444;
            --accent-hover: #dc2626;
            --border-color: rgba(255, 255, 255, 0.06);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #020617;
        }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .login-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 40px; border-radius: 16px; width: 100%; max-width: 450px; box-sizing: border-box; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .brand { font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 24px; }
        .brand i { color: var(--accent-red); margin-right: 8px; }
        
        /* Form Toggle Tabs */
        .auth-tabs { display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 24px; }
        .auth-tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; color: var(--text-muted); font-weight: 600; font-size: 15px; transition: 0.2s; }
        .auth-tab.active { color: var(--accent-red); border-bottom: 2px solid var(--accent-red); }

        .form-container { display: none; }
        .form-container.active { display: block; }

        label { font-size: 13px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 8px; }
        input { width: 100%; background: var(--input-bg); border: 1px solid var(--border-color); padding: 12px 14px; border-radius: 8px; color: white; font-size: 14px; box-sizing: border-box; margin-bottom: 20px; font-family: inherit; }
        input:focus { border-color: var(--accent-red); outline: none; }
        
        .btn-submit { width: 100%; background: var(--accent-red); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-bottom: 20px; }
        .btn-submit:hover { background: var(--accent-hover); box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2); }
        
        /* Social Providers Buttons */
        .divider { display: flex; align-items: center; text-align: center; color: var(--text-muted); font-size: 12px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border-color); }
        .divider:not(:empty)::before { margin-right: .25em; }
        .divider:not(:empty)::after { margin-left: .25em; }

        .social-grid { display: flex; flex-direction: column; gap: 10px; }
        .social-btn { display: flex; align-items: center; justify-content: center; gap: 10px; background: #111827; border: 1px solid var(--border-color); color: white; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.2s; text-decoration: none; }
        .social-btn:hover { background: #1f2937; border-color: rgba(255,255,255,0.15); }
        .social-btn i { font-size: 16px; }
        .fa-google { color: #ea4335; }
        .fa-github { color: #f0f6fc; }

        .error-msg { color: #f87171; font-size: 13px; text-align: center; margin-bottom: 15px; display: none; }
        .success-msg { color: #34d399; font-size: 13px; text-align: center; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand"><i class="fa-solid fa-wand-magic-sparkles"></i> Waqas AI Studio</div>
        
        <div class="auth-tabs">
            <div class="auth-tab active" onclick="toggleAuth('signin', this)">Sign In</div>
            <div class="auth-tab" onclick="toggleAuth('signup', this)">Create Account</div>
        </div>
        
        <div class="error-msg" id="error-box">Invalid credentials parameter block!</div>
        <div class="success-msg" id="success-box">Account registered successfully! Please log in.</div>

        <div id="signin-form-block" class="form-container active">
            <form onsubmit="handleSignIn(event)">
                <label>Email Address</label>
                <input type="email" id="signin-email" required placeholder="name@company.com">
                
                <label>Password</label>
                <input type="password" id="signin-password" required placeholder="••••••••">
                
                <button type="submit" class="btn-submit">Sign In to Studio</button>
            </form>
        </div>

        <div id="signup-form-block" class="form-container">
            <form onsubmit="handleSignUp(event)">
                <label>Full Name</label>
                <input type="text" id="signup-name" required placeholder="Waqas Murtaza">

                <label>Email Address</label>
                <input type="email" id="signup-email" required placeholder="name@company.com">
                
                <label>Password</label>
                <input type="password" id="signup-password" required placeholder="Create strong password">
                
                <button type="submit" class="btn-submit" style="background:#10b981;">Create Free Account</button>
            </form>
        </div>

        <div class="divider">Or continue with</div>
        <div class="social-grid">
            <button class="social-btn" onclick="triggerOauth('Google')">
                <i class="fa-brands fa-google"></i> Continue with Google
            </button>
            <button class="social-btn" onclick="triggerOauth('GitHub')">
                <i class="fa-brands fa-github"></i> Continue with GitHub
            </button>
        </div>
    </div>

    <script>
        // Form Toggle Handler
        function toggleAuth(type, element) {
            var tabs = document.getElementsByClassName('auth-tab');
            for(var i=0; i<tabs.length; i++) { tabs[i].classList.remove('active'); }
            element.classList.add('active');

            document.getElementById('signin-form-block').classList.remove('active');
            document.getElementById('signup-form-block').classList.remove('active');
            document.getElementById('error-box').style.display = "none";
            document.getElementById('success-box').style.display = "none";

            if(type === 'signin') {
                document.getElementById('signin-form-block').classWith = document.getElementById('signin-form-block').classList.add('active');
            } else {
                document.getElementById('signup-form-block').classList.add('active');
            }
        }

        // Sign In Execution System
        function handleSignIn(event) {
            event.preventDefault();
            var email = document.getElementById('signin-email').value;
            var password = document.getElementById('signin-password').value;
            
            // Checking validation registry cache
            var savedEmail = localStorage.getItem("registeredEmail") || "admin@waqas.com";
            var savedPassword = localStorage.getItem("registeredPassword") || "123456";

            if(email === savedEmail && password === savedPassword) {
                localStorage.setItem("isLoggedIn", "true");
                window.location.href = "studio.html";
            } else {
                var errBox = document.getElementById('error-box');
                errBox.innerText = "Error: Invalid email or password structure.";
                errBox.style.display = "block";
            }
        }

        // Sign Up Data Logic
        function handleSignUp(event) {
            event.preventDefault();
            var name = document.getElementById('signup-name').value;
            var email = document.getElementById('signup-email').value;
            var password = document.getElementById('signup-password').value;

            // Saving registration fields to LocalStorage for live simulation
            localStorage.setItem("registeredEmail", email);
            localStorage.setItem("registeredPassword", password);
            localStorage.setItem("registeredName", name);

            document.getElementById('success-box').style.display = "block";
            
            // Smoothly bounce back to Sign In state
            setTimeout(function(){
                toggleAuth('signin', document.getElementsByClassName('auth-tab')[0]);
            }, 1500);
        }

        // OAuth Bridge Handler Simulation
        function triggerOauth(provider) {
            alert("Connecting secure handshake payload interface with " + provider + " APIs...");
            localStorage.setItem("isLoggedIn", "true");
            window.location.href = "studio.html";
        }
    </script>
</body>
</html>
