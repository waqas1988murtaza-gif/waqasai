<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waqas AI Studio - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --sidebar-bg: #111827;
            --card-bg: #1f2937;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --primary: #ef4444;
            --border: rgba(255, 255, 255, 0.08);
        }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: var(--sidebar-bg); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .brand { font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .brand i { color: var(--primary); }
        .menu-items { display: flex; flex-direction: column; gap: 8px; list-style: none; padding: 0; margin: 20px 0 0 0; }
        .menu-link { display: flex; align-items: center; gap: 12px; padding: 12px; color: var(--text-muted); text-decoration: none; border-radius: 8px; font-weight: 500; }
        .menu-link.active { background: rgba(239, 68, 68, 0.1); color: var(--text-main); }
        .main-content { flex-grow: 1; padding: 40px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { font-family: 'Outfit', sans-serif; margin: 0; }
        .studio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .tool-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 25px; }
        .tool-title { font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 600; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        textarea, input[type="text"] { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 8px; color: white; padding: 12px; box-sizing: border-box; margin-bottom: 15px; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; }
        select { width: 100%; background: rgba(0,0,0,0.3); color: white; border: 1px solid var(--border); padding: 12px; border-radius: 8px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="brand"><i class="fa-solid fa-wand-magic-sparkles"></i> Waqas Studio</div>
        <ul class="menu-items">
            <li><a href="#" class="menu-link active"><i class="fa-solid fa-cubes"></i> AI Studio</a></li>
        </ul>
    </div>
    <div class="main-content">
        <div class="header">
            <h1>Welcome back, Waqas Bhai 👋</h1>
            <div style="background: rgba(239, 68, 68, 0.2); padding: 8px 16px; border-radius: 20px; font-size: 14px; color: #ff7b7b; font-weight: 600;">Pro Member</div>
        </div>
        <div class="studio-grid">
            <div class="tool-box">
                <div class="tool-title"><i class="fa-solid fa-volume-high" style="color: #3b82f6;"></i> AI Text To Speech</div>
                <textarea rows="5" placeholder="Yahan apna text likhein jisko AI voice mein badalna hai..."></textarea>
                <button class="btn" onclick="alert('AI Voice System Active!')">Generate Audio</button>
            </div>
            <div class="tool-box">
                <div class="tool-title"><i class="fa-solid fa-image" style="color: #10b981;"></i> Studio Image Generator</div>
                <input type="text" placeholder="Describe the image you want to create...">
                <button class="btn" style="background: #10b981;" onclick="alert('AI Image System Active!')">Generate Image</button>
            </div>
        </div>
    </div>
</body>
</html>
